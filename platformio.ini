; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = espNow_sensor_esp

; ------------------------------------------------------------------------------
; SHARED SETTINGS
; Applies to all [env:NAME] unless overridden in that env.
; IMPORTANT: monitor_filters is NOT set here — esp32_exception_decoder is
; ESP32-only and must not bleed into nRF52 envs.
; IMPORTANT: TinyUSB -I path is nRF52-only and must not be in [env].
; ------------------------------------------------------------------------------
[env]
framework   = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit MMC56x3
    adafruit/Adafruit LSM6DS @ ^4.0
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    ;madhephaestus/ESP32Servo @ ^3.0.6
    arduino-libraries/Madgwick
    tkjelectronics/Kalman Filter Library @ ^1.0.2
    sparkfun/SparkFun Qwiic Scale NAU7802 Arduino Library @ ^1.0.4
    tomstewart89/BasicLinearAlgebra
    ADS1115_WE
    mikalhart/TinyGPSPlus@^1.0.3
 

lib_ldf_mode = deep+

; ------------------------------------------------------------------------------
; PRODUCTION – ESP32
; ------------------------------------------------------------------------------
[env:espNow_receiver_esp]
platform = espressif32
board = nodemcu-32s
; ESP32 HW-394 haengt am CP2102/CH340 USB-UART-Bridge -> cu.usbserial-*
; (NICHT cu.usbmodem*, das ist der XIAO ESP32S3!)
upload_port = /dev/cu.usbserial-110
monitor_port = /dev/cu.usbserial-110
build_src_filter = +<../src/main_espNow_receiver.cpp>

[env:espNow_sensor_esp]
platform = espressif32
board = esp32-s3-devkitm-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_opi
; ESP32-S3 nutzt natives USB-CDC -> ohne diese Flags kommt kein Serial-Output an
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_filters = esp32_exception_decoder

;upload_port = /dev/ttyACM1
;monitor_port = /dev/ttyACM1
build_src_filter = +<../src/main_espNow_sender.cpp>

; ------------------------------------------------------------------------------
; BLE telemetry hub — Seeed XIAO ESP32S3 (NimBLE)
; (ersetzt das alte nRF52840-Env BLE_sender_xiao)
;   UART <- ESP-NOW-Aggregator: Serial1 RX=GPIO44/D7, TX=GPIO43/D6
;   GPS  <- u-blox I2C (DDC 0x42) auf D4/D5
; ------------------------------------------------------------------------------
[env:prod_BLE_sender]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; ESP32-S3 nutzt natives USB-CDC (Serial-Konsole) + NimBLE-Verbindungsbudget.
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
; Nur die Hub-eigenen Libs: ueberschreibt die Sensor-/ESP-NOW-Libs aus [env].
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.1.0
    mikalhart/TinyGPSPlus @ ^1.0.3
; XIAO ESP32S3 meldet sich als natives USB-CDC -> cu.usbmodem*
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
build_src_filter = +<../src/main_BLE_sender.cpp>

; ------------------------------------------------------------------------------
; BLE hub SIMULATION — synthetische GPS/IMU/Dolle-Daten, keine Sensoren/UART.
; Gleiches Board/Flags/Deps wie prod_BLE_sender, nur ein anderes main.
;   pio run -e sim_BLE_sender -t upload -t monitor
; ------------------------------------------------------------------------------
[env:sim_BLE_sender]
extends = env:prod_BLE_sender
build_src_filter = +<../src/main_BLE_sim.cpp>



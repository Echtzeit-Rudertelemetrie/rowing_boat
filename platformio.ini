; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Default-Umgebung fuer "Build" (Strg+Alt+B)
;default_envs = prod_nodemcu-32s 
;default_envs = test_gyro
;default_envs = waveshare_s3_mini
default_envs = xiao_s3
; ------------------------------------------------------------------------------
; SHARED SETTINGS (Applies to all environments below)
; ------------------------------------------------------------------------------
[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library @ ^1.2.13
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit MMC56x3
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    
    ;arduino-libraries/Madgwick 
   ; tkjelectronics/Kalman Filter Library @ ^1.0.2 ; ???
    sparkfun/SparkFun Qwiic Scale NAU7802 Arduino Library @ ^1.0.4

; ------------------------------------------------------------------------------
; 1. PRODUCTION ENVIRONMENTS (Compiles src/main.cpp)
; ------------------------------------------------------------------------------
[env:prod_nodemcu-32s]
platform = espressif32
;board = nodemcu-32s
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_opi
; ESP32-S3 nutzt natives USB-CDC -> ohne diese Flags kommt kein Serial-Output an
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
; Compile everything in src/, ignore the test folder
#upload_port = /dev/ttyACM0
#monitor_port = /dev/ttyACM0
build_src_filter = +<*> -<../test/>

[env:waveshare_s3_mini]
platform = espressif32
;board = nodemcu-32s
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
;- qio_opi on the devkitc-1 envs is a real risk, not just noise: 
;it's only correct if those boards are N8R8 (octal PSRAM). 
;On an N8 or N8R2 devkit, forcing qio_opi gives you a bootloop. 
;Worth verifying which modules you actually have.
board_build.arduino.memory_type = qio_opi
; ESP32-S3 nutzt natives USB-CDC -> ohne diese Flags kommt kein Serial-Output an
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
; Compile everything in src/, ignore the test folder
#upload_port = /dev/ttyACM0
#monitor_port = /dev/ttyACM0
build_src_filter = +<../src/mainDolle.cpp>

;@TODO: umbenennen und für dolle spezifizieren (wie in main ggf.)
[env:xiao_s3]
platform = espressif32
board = seeed_xiao_esp32s3
;board_upload.flash_size = 4MB
; Partitionstabelle: Board-Default default_8MB.csv (XIAO hat 8MB Flash), kein Override noetig
; gyro.cpp nutzt LittleFS -> uploadfs muss ein LittleFS-Image bauen, kein SPIFFS
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
; ESP32-S3 nutzt natives USB-CDC -> ohne diese Flags kommt kein Serial-Output an
; -O2 statt -Os (Arduino-Default): optimiert auf Tempo statt Groesse — der
; 100-Hz-EKF-Matrixpfad profitiert von Inlining/Loop-Optimierungen, und Flash
; ist mit 8 MB reichlich da (Firmware aktuell ~22%).
build_unflags = -Os
build_flags =
    -O2
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ANGLEREADER_PROFILING=1 ;messen der ekf Berechnungen (eine Berechnung benötigt im Schnitt 150 µs [Verdammt schnell]), einschalten mit 1
; Compile everything in src/, ignore the test folder
#upload_port = /dev/ttyACM0
#monitor_port = /dev/ttyACM0
build_src_filter = -<*> +<../src/mainDolle.cpp>

; Wie xiao_s3, aber mit Paket-Debug-Dump auf Serial (DataSender.cpp).
; Nur mit angeschlossenem Monitor benutzen — ohne Host, der USB-CDC liest,
; blockiert die ~900-Zeichen-Ausgabe den 100-Hz-Sample-Task.
[env:xiao_s3_debug]
extends = env:xiao_s3
build_flags =
    ${env:xiao_s3.build_flags}
    -D DATASENDER_DEBUG_DUMP=1

; Rohdaten-Stream fuer die MATLAB-Skripte in ../matlab_simulationen
; (main_test_S3.m etc.): ICM-20948 Accel/Gyro/Mag mit 100 Hz im
; ">imu/Acce_x: ..."-Zeilenformat. Kein EKF, kein ESP-NOW.
[env:xiao_s3_matlab]
extends = env:xiao_s3
build_src_filter = -<*> +<../test/test_imu_stream_s3.cpp>

;until here
[env:prod_esp32dev]
platform = espressif32
board = esp32dev
upload_speed = 115200
build_src_filter = +<*> -<../test/>

[env:test_receiver]
platform = espressif32
board = nodemcu-32s
build_src_filter = +<../test/test_receiver.cpp> -<*>

[env:test_sender]
platform = espressif32
board = nodemcu-32s
build_src_filter = +<../test/test_sender.cpp> -<*>

[env:test_idle]
platform = espressif32
board = nodemcu-32s
build_src_filter = +<../test/test_idle.cpp> -<*>

[env:test_ble]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_flags =
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
build_src_filter = +<../test/test_ble.cpp> -<*>
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3



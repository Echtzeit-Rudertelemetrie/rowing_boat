; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Default-Umgebung fuer "Build" (Strg+Alt+B)
;default_envs = prod_nodemcu-32s 
;default_envs = test_gyro
;default_envs = waveshare_s3_mini
;default_envs = xiao_s3
default_envs = prod_BLE_sender
; ------------------------------------------------------------------------------
; SHARED SETTINGS
; Applies to all [env:NAME] unless overridden in that env.
; IMPORTANT: monitor_filters is NOT set here — esp32_exception_decoder is
; ESP32-only and must not bleed into nRF52 envs.
; IMPORTANT: TinyUSB -I path is nRF52-only and must not be in [env].
; ------------------------------------------------------------------------------
[env]
framework   = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
lib_deps =
    sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library @ ^1.2.13
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit MMC56x3
    adafruit/Adafruit LSM6DS @ ^4.0
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    
    ;arduino-libraries/Madgwick 
   ; tkjelectronics/Kalman Filter Library @ ^1.0.2 ; ???
    sparkfun/SparkFun Qwiic Scale NAU7802 Arduino Library @ ^1.0.4
    tomstewart89/BasicLinearAlgebra
    ADS1115_WE
    mikalhart/TinyGPSPlus@^1.0.3
 

lib_ldf_mode = deep+

; ------------------------------------------------------------------------------
; PRODUCTION – ESP32
; ------------------------------------------------------------------------------
[env:espNow_receiver_esp]
platform = espressif32
board = nodemcu-32s
extra_scripts = pre:scripts/select_upload_port.py
monitor_port = .pio/monitor-espNow_receiver_esp
build_src_filter = +<../src/main_espNow_receiver.cpp>

[env:espNow_receiver_esp_debug]
extends = env:espNow_receiver_esp
build_flags =
    ${env.build_flags}
    -D ESPNOW_RECEIVER_SERIAL_DUMP=1

; ------------------------------------------------------------------------------
; BLE telemetry hub — Seeed XIAO ESP32S3 (NimBLE)
; (ersetzt das alte nRF52840-Env BLE_sender_xiao)
;   UART <- ESP-NOW-Aggregator: Serial1 RX=GPIO44/D7, TX=GPIO43/D6
;   GPS  <- NEO-M8T UART: Serial2 RX=D10/GPIO9, TX=D9/GPIO8
; ------------------------------------------------------------------------------
[env:prod_BLE_sender]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; ESP32-S3 nutzt natives USB-CDC (Serial-Konsole) + NimBLE-Verbindungsbudget.
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
; Nur die Hub-eigenen Libs: ueberschreibt die Sensor-/ESP-NOW-Libs aus [env].
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.1.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library @ ^1.2.13
extra_scripts = pre:scripts/select_upload_port.py
monitor_port = .pio/monitor-prod_BLE_sender
build_src_filter = +<../src/main_BLE_sender.cpp>

[env:prod_BLE_sender_debug]
extends = env:prod_BLE_sender
build_flags =
    ${env:prod_BLE_sender.build_flags}
    -D BLE_SERIAL_DUMP=1

; Boots-IMU standalone diagnostics and magnetometer calibration. Die
; Kalibrierung kommt wie in der Produktion ueber die Board-MAC aus der
; Einheitentabelle in lib/UnitIdentity, nicht aus einem eigenen Profil.
[env:boat_imu_diag]
extends = env:prod_BLE_sender
monitor_speed = 460800
build_src_filter = -<*> +<../test/angle_diagnostics_s3.cpp>
build_flags =
    ${env:prod_BLE_sender.build_flags}
    -D ANGLE_DIAGNOSTIC_BUILD=1
    -D BOAT_IMU_DIAGNOSTIC=1

; Langsame, menschenlesbare Ausgabe zur Bestimmung der physischen Bootsachse.
[env:boat_imu_axis_check]
extends = env:boat_imu_diag
build_flags =
    ${env:boat_imu_diag.build_flags}
    -D HUMAN_AXIS_CHECK=1

; ------------------------------------------------------------------------------
; BLE hub SIMULATION — synthetische GPS/IMU/Dolle-Daten, keine Sensoren/UART.
; Gleiches Board/Flags/Deps wie prod_BLE_sender, nur ein anderes main.
;   pio run -e sim_BLE_sender -t upload -t monitor
; ------------------------------------------------------------------------------
[env:sim_BLE_sender]
extends = env:prod_BLE_sender
build_src_filter = +<../src/main_BLE_sim.cpp>

; ------------------------------------------------------------------------------
; GPS-Empfaenger einrichten — baut keine Firmware, sondern spricht den NEO-M8T
; ueber dessen eigenen USB-Port an: 10 Hz, 115200 Baud auf UART1, nur GGA+RMC.
; Die Einstellungen landen im Flash des Moduls und ueberleben einen Neustart.
; Noetig bei einem Ersatzmodul, das ab Werk mit 9600 Baud laeuft.
;   pio run -e gps_config -t configure
; ------------------------------------------------------------------------------
[env:gps_config]
extends = env:prod_BLE_sender
extra_scripts = post:scripts/gps_config_target.py

;@TODO: umbenennen und für dolle spezifizieren (wie in main ggf.)
[env:xiao_s3]
platform = espressif32
board = seeed_xiao_esp32s3
;board_upload.flash_size = 4MB
; Partitionstabelle: Board-Default default_8MB.csv (XIAO hat 8MB Flash), kein Override noetig
; gyro.cpp nutzt LittleFS -> uploadfs muss ein LittleFS-Image bauen, kein SPIFFS
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
; ESP32-S3 nutzt natives USB-CDC -> ohne diese Flags kommt kein Serial-Output an
; -O2 statt -Os (Arduino-Default): optimiert auf Tempo statt Groesse — der
; 100-Hz-EKF-Matrixpfad profitiert von Inlining/Loop-Optimierungen, und Flash
; ist mit 8 MB reichlich da (Firmware aktuell ~22%).
build_unflags = -Os
build_flags =
    -O2
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
; Selects stable Linux by-id paths and the former macOS cu.* paths when present.
extra_scripts = pre:scripts/select_upload_port.py
monitor_port = .pio/monitor-xiao_s3
build_src_filter = -<*> +<../src/mainDolle.cpp>

; Wie xiao_s3, aber mit schlankem Teleplot-Stream fuer den Monitor:
;   >kraft_N, >kraft0_N, >kraft1_N, >drift_N (ForceReader) und >winkel_q.
; Der grosse Paket-Dump (DATASENDER_DEBUG_DUMP, ~900 Zeichen/Paket) bleibt AUS —
; er blockiert den USB-CDC und laesst Teleplot laggen. Bei Bedarf temporaer
; -D DATASENDER_DEBUG_DUMP=1 ergaenzen (nur mit angeschlossenem Monitor).
[env:xiao_s3_debug]
extends = env:xiao_s3
build_flags =
    ${env:xiao_s3.build_flags}
    -D ANGLEREADER_PROFILING=1
    -D DATASENDER_TELEPLOT=1
    -D FORCE_READER_DEBUG=1

; Standalone orientation diagnostics and calibration. No force ADC, WiFi or
; ESP-NOW. Runs the production AngleReader at 100 Hz and emits CSV at 50 Hz.
[env:xiao_s3_angle_diag]
extends = env:xiao_s3
monitor_speed = 460800
build_src_filter = -<*> +<../test/angle_diagnostics_s3.cpp>
build_flags =
    ${env:xiao_s3.build_flags}
    -D ANGLE_DIAGNOSTIC_BUILD=1

;until here
[env:prod_esp32dev]
platform = espressif32
board = esp32dev
upload_speed = 115200
build_src_filter = +<*> -<../test/>

; [env:test_receiver] und [env:test_sender] entfielen beim Merge von
; sensor_miniesp_code: ihre Quellen bauten auf lib/ESPNOW/espnow.h, die in main
; durch EspNowReceiver/EspNow_sender_App abgeloest wurde. espnow.h definierte
; PACKET_VALUES, ESPNOW_CHANNEL und ESPNOW_MAX_BOARD_ID als Makros gegen
; AppTypes.h und ein zweites Paketlayout (RowingPacket neben MeasurementPack).

[env:test_idle]
platform = espressif32
board = nodemcu-32s
build_src_filter = +<../test/test_idle.cpp> -<*>

[env:test_ble]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
;upload_port = /dev/ttyACM0
;monitor_port = /dev/ttyACM0
build_src_filter = +<../src/main_BLE_sender.cpp>
; eigene lib_deps: ESP32-only Bibliotheken aus [env] hier NICHT verwenden
;lib_deps = ?
